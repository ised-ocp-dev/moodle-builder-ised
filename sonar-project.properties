sonar.projectKey=DSDMDL-moodle-builder
sonar.projectName=DSDMDL Moodle
sonar.projectVersion=1.0
sonar.php.coverage.reportPaths=tests/coverage.xml

sonar.language=php

sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.dependencyCheck.skip=true

sonar.issue.ignore.allfile=r1
sonar.issue.ignore.allfile.r1.fileRegexp=.*\.(php|install|module|inc)$
sonar.exclusions=**
sonar.coverage.exclusions=**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
